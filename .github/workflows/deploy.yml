name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One-time cleanup for a stale Worker *secret* named
      # NEXT_PUBLIC_SITE_URL (pointing at a broken "https://www.forthe22.org"
      # with no DNS record) that predates committing this var into
      # wrangler.jsonc's `vars`. Secrets are a separate binding namespace
      # from plaintext vars — a `vars` push in "Build and deploy" below
      # does NOT clear or overwrite an existing secret of the same name, so
      # this stale secret silently kept shadowing the correct vars value on
      # every deploy since, corrupting SITE_URL (and every SITE_URL-derived
      # cross-domain link/canonical) site-wide. `|| true` makes this a safe
      # no-op on every future run once the stale secret is actually gone.
      - name: Remove stale NEXT_PUBLIC_SITE_URL secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "y" | npx wrangler secret delete NEXT_PUBLIC_SITE_URL --name forthe22 || true

      - name: Build and deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://forthe22.org
          NEXT_PUBLIC_CAMPAIGN_URL: https://tri.forthe22.org
          NEXT_PUBLIC_RUCK_URL: https://ruck.forthe22.org
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # Worker *secret* bindings (as opposed to the plaintext `vars` block in
      # wrangler.jsonc) live outside the deployed config, so a dashboard-only
      # secret silently survives most deploys — but there's no guarantee of
      # that, and it means the Worker's actual secret set can drift from
      # what's in GitHub, unnoticed, until someone rotates a value in only
      # one place. Re-pushing the full set from GitHub Actions secrets on
      # every deploy makes GitHub the single source of truth, same as the
      # `vars` block already is for non-secret config — see the comment
      # above `vars` in wrangler.jsonc for the incident that motivated that.
      # Add new server-only secrets here AND as a repo secret
      # (Settings -> Secrets and variables -> Actions); values that are
      # genuinely safe for the browser belong in wrangler.jsonc's `vars`
      # instead, not here. NEXT_PUBLIC_SUPABASE_URL/ANON_KEY used to be
      # synced from here too — moved to wrangler.jsonc's `vars` instead
      # (see the comment there) because this step running *after* the
      # deploy step left a window, on every single deploy, where the newly
      # published Worker version had no Supabase config at all and every
      # /admin page (including sign-in) broke until this step caught up.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          SECRET_PREVIEW_ACCESS_TOKEN: ${{ secrets.PREVIEW_ACCESS_TOKEN }}
          SECRET_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SECRET_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
          SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const names = [
              'SUPABASE_SERVICE_ROLE_KEY',
              'WHOOP_CLIENT_SECRET',
              'PREVIEW_ACCESS_TOKEN',
              'ADMIN_EMAILS',
              'CLOUDFLARE_WEB_ANALYTICS_SITE_TAG',
              'CLOUDFLARE_ACCOUNT_ID',
              'CLOUDFLARE_ANALYTICS_API_TOKEN',
            ];
            const out = {};
            for (const name of names) {
              const value = process.env['SECRET_' + name];
              if (value) out[name] = value;
            }
            fs.writeFileSync('.worker-secrets.json', JSON.stringify(out));
          "
          npx wrangler secret bulk .worker-secrets.json
          rm -f .worker-secrets.json
